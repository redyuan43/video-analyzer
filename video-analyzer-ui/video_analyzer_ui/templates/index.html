<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <div>
                <h1>Video Analyzer</h1>
                <p>URL workflow console</p>
            </div>
            <a class="ghost-link" href="/">首页</a>
        </header>

        <section class="workspace">
            <aside class="sidebar">
                <section class="panel">
                    <h2>新建任务</h2>
                    <form id="jobForm" class="job-form">
                        <label class="wide">
                            <span>视频链接</span>
                            <textarea id="videoUrls" name="video_urls" rows="5" placeholder="一行一个 https:// 链接" required></textarea>
                        </label>
                        <label>
                            <span>分析模式</span>
                            <select id="analysisMode" name="analysis_mode"></select>
                        </label>
                        <label>
                            <span>运行配置</span>
                            <select id="profile" name="profile"></select>
                        </label>
                        <label>
                            <span>运行名称</span>
                            <input id="runName" name="run_name" type="text">
                        </label>
                        <label>
                            <span>Cookie 来源</span>
                            <select id="cookieBrowser" name="cookies_from_browser"></select>
                        </label>
                        <label class="check">
                            <input id="skipImages" name="skip_images" type="checkbox">
                            <span>跳过配图提示词</span>
                        </label>
                        <details class="advanced">
                            <summary>采集选项</summary>
                            <label class="check"><input id="keepExisting" type="checkbox"><span>复用已有下载</span></label>
                            <label class="check"><input id="includeSubtitles" type="checkbox"><span>纳入字幕</span></label>
                            <label class="check"><input id="preferSubtitleTranscript" type="checkbox"><span>优先字幕 transcript</span></label>
                            <label class="check"><input id="includeComments" type="checkbox"><span>纳入评论</span></label>
                            <label class="check"><input id="refreshContext" type="checkbox"><span>刷新上下文</span></label>
                            <label>
                                <span>最多评论数</span>
                                <input id="maxComments" type="number" min="0" step="1">
                            </label>
                            <label>
                                <span>字幕语言</span>
                                <input id="subtitleLangs" type="text">
                            </label>
                        </details>
                        <button id="createButton" type="submit">启动任务</button>
                        <div id="formError" class="error-text"></div>
                        <div id="batchResult" class="muted"></div>
                    </form>
                </section>

                <section class="panel">
                    <div class="panel-head">
                        <h2>最近任务</h2>
                        <button id="refreshJobsButton" class="secondary" type="button">刷新</button>
                    </div>
                    <div id="jobList" class="job-list"></div>
                </section>

                <section class="panel">
                    <h2>全局状态</h2>
                    <div id="globalSummary" class="summary-grid"></div>
                </section>

                <section class="panel">
                    <h2>资源队列</h2>
                    <div id="resourceLanes" class="resource-lanes"></div>
                </section>
            </aside>

            <section class="main-panel">
                <section class="panel hero-panel">
                    <div>
                        <h2 id="selectedTitle">未选择任务</h2>
                        <p id="selectedSubtitle">创建或选择一个任务后查看进度。</p>
                    </div>
                    <div class="actions">
                        <button id="runButton" type="button" disabled>继续运行</button>
                    </div>
                </section>

                <section class="panel stats-panel">
                    <div><span>总体状态</span><strong id="statusValue">-</strong></div>
                    <div><span>当前阶段</span><strong id="currentStageValue">-</strong></div>
                    <div><span>下一阶段</span><strong id="nextStageValue">-</strong></div>
                    <div><span>队列</span><strong id="queueValue">-</strong></div>
                    <div class="progress-row">
                        <span id="progressText">0/0</span>
                        <div class="bar"><div id="progressBar"></div></div>
                    </div>
                </section>

                <section id="errorPanel" class="panel error-panel" hidden>
                    <h2 id="errorTitle">流程失败</h2>
                    <p id="errorMessage"></p>
                </section>

                <section class="panel">
                    <h2>任务信息</h2>
                    <div class="info-grid">
                        <div><span>视频链接</span><strong id="detailUrl">-</strong></div>
                        <div><span>运行目录</span><strong id="detailRunDir">-</strong></div>
                        <div><span>分析模式</span><strong id="detailMode">-</strong></div>
                        <div><span>更新时间</span><strong id="detailUpdated">-</strong></div>
                    </div>
                </section>

                <section class="panel">
                    <h2>阶段</h2>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr><th>阶段</th><th>状态</th><th>耗时</th><th>队列</th><th>日志</th></tr>
                            </thead>
                            <tbody id="stageRows"></tbody>
                        </table>
                    </div>
                </section>

                <section id="corePanel" class="panel" hidden>
                    <h2 id="corePanelTitle">阶段子项</h2>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr><th>子项</th><th>状态</th><th>耗时</th><th>最近信号</th></tr>
                            </thead>
                            <tbody id="coreRows"></tbody>
                        </table>
                    </div>
                </section>

                <section class="panel">
                    <h2>产物</h2>
                    <div id="artifactSummary" class="artifact-summary">-</div>
                </section>

                <section class="panel">
                    <div class="panel-head">
                        <div>
                            <h2>当前日志</h2>
                            <p id="logHint">暂无日志</p>
                        </div>
                        <button id="copyLogButton" class="secondary" type="button" disabled>复制完整日志</button>
                    </div>
                    <pre id="logText">-</pre>
                    <div id="copyMessage" class="muted"></div>
                </section>
            </section>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
